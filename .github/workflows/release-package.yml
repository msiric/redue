name: Exact release tarball smoke (no publication)
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Existing exact-release-candidate run to validate without repacking
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node --test test/package-release.test.mjs
      - run: node test/acceptance/registry-name.mjs
      - name: Audit and pack once
        if: ${{ !inputs.artifact_run_id }}
        run: |
          npm audit --omit=dev
          mkdir release-candidate
          npm pack --json --pack-destination release-candidate > release-candidate/manifest.json
          node test/acceptance/package-artifact.mjs record release-candidate/manifest.json
      - name: Reuse preserved exact candidate
        if: ${{ inputs.artifact_run_id }}
        uses: actions/download-artifact@v4
        with:
          name: exact-release-candidate
          path: release-candidate
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - run: node test/acceptance/package-artifact.mjs verify release-candidate/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: exact-release-candidate
          path: release-candidate/
          retention-days: 14
  smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: exact-release-candidate
          path: release-candidate
      - name: Install exact tarball and exercise public binary
        run: node test/acceptance/package-smoke.mjs --manifest release-candidate/manifest.json
      - name: Reviewed TypeScript 5.5.2 with exact installed package
        run: node test/acceptance/package-smoke.mjs --manifest release-candidate/manifest.json --compiler 5.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Reviewed npm proxy context with exact installed package
        run: node test/acceptance/proxy-package-smoke.mjs --manifest release-candidate/manifest.json
      - name: Released alpha.2 observer and receipt-preserving upgrade
        run: node test/acceptance/receipt-upgrade.mjs --manifest release-candidate/manifest.json
      - name: Released alpha.3 npm contract and receipt-preserving containment
        run: node test/acceptance/npm-containment-upgrade.mjs --manifest release-candidate/manifest.json
      - name: Explicit existing-user recipe selection through public containment
        run: node test/acceptance/direct-recipe-upgrade.mjs --manifest release-candidate/manifest.json
      - name: Installed agent policy update and safe removal
        run: node test/acceptance/agent-policy-upgrade.mjs --manifest release-candidate/manifest.json
