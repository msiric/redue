name: Product regressions and package installation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
permissions:
  contents: read
concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  product:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, node: '22'}
          - {os: ubuntu-latest, node: '22'}
          - {os: windows-2025, node: '22'}
          - {os: ubuntu-latest, node: '24'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Install tarball, exercise CLI, and remove owned state/install
        run: npm run test:package
      - name: PowerShell npm-generated command shim
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'redue-powershell-install'
          $pack = npm pack --json | ConvertFrom-Json
          npm.cmd install --global --prefix $prefix $pack[0].filename --no-audit --no-fund
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & (Join-Path $prefix 'redue.cmd') --help
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $packageName = (Get-Content package.json | ConvertFrom-Json).name
          npm.cmd uninstall --global --prefix $prefix $packageName --no-audit --no-fund
          exit $LASTEXITCODE
  typescript-versions:
    # The direct recipe takes any TypeScript 5.x or 6.0 whose installed files
    # match the tarball the lockfile names in npm's cache. The shared contract
    # suite runs against the last release of each minor from 5.0 to 5.8 that
    # the reviewed releases do not already cover.
    strategy:
      fail-fast: false
      matrix:
        typescript: ['5.0.4', '5.1.6', '5.2.2', '5.3.3', '5.4.5', '5.5.4', '5.7.3', '5.8.3']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Install the compiler fixture (its tarball lands in npm's cache)
        run: node test/helpers/install-typescript-fixture.mjs ${{ matrix.typescript }}
      - run: node --test test/direct-typescript-versions.test.mjs
        env:
          REDUE_TEST_TYPESCRIPT: ${{ matrix.typescript }}
