name: Prepare alpha package (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Exact public npm registry identity (read-only)
        run: node test/acceptance/registry-name.mjs
      - name: Runtime dependency advisory audit
        run: npm audit --omit=dev --json > runtime-audit.json
        continue-on-error: true
      - run: npm run test:package
      - name: Build inspectable release artifact
        run: |
          npm pack --json > package-manifest.json
          sha256sum redue-*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: redue-alpha-candidate
          path: |
            redue-*.tgz
            package-manifest.json
            SHA256SUMS
            runtime-audit.json
          retention-days: 14
