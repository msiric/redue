name: Prepare alpha package (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Exact public npm registry identity (read-only)
        run: node test/acceptance/registry-name.mjs
      - name: Runtime dependency advisory audit
        run: npm audit --omit=dev --json > runtime-audit.json
        continue-on-error: true
      - name: Build inspectable release artifact
        run: |
          mkdir release-candidate
          npm pack --json --pack-destination release-candidate > release-candidate/manifest.json
          node test/acceptance/package-artifact.mjs record release-candidate/manifest.json
      - run: node test/acceptance/package-smoke.mjs --manifest release-candidate/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: redue-alpha-candidate
          path: |
            release-candidate/
            runtime-audit.json
          retention-days: 14
