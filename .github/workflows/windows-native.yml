name: Windows native acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record native environment
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $drive = (Get-Location).Path.Substring(0,1)
          $volume = Get-Volume -DriveLetter $drive
          "OS: $($os.Caption) $($os.Version) build $($os.BuildNumber)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Runner image: $env:ImageOS $env:ImageVersion" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Architecture: $env:PROCESSOR_ARCHITECTURE; filesystem: $($volume.FileSystem)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "PowerShell: $($PSVersionTable.PSVersion); Node: $(node --version); npm: $(npm --version)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Install product dependencies
        run: npm ci
      - name: Inspect public Windows shims and path aliases
        shell: pwsh
        run: |
          @'
          import fs from 'node:fs';
          import os from 'node:os';
          import {spawnSync} from 'node:child_process';
          import {findExecutable} from './src/executable-lookup.mjs';
          import {windowsLaunch} from './src/windows-command.mjs';
          const npm=findExecutable('npm');
          const launch=windowsLaunch([npm,'--version']);
          const ran=spawnSync(launch.file,launch.args,{...launch.options,encoding:'utf8'});
          console.log(JSON.stringify({temp:os.tmpdir(),real:fs.realpathSync(os.tmpdir()),
            native:fs.realpathSync.native(os.tmpdir()),npm,launch,
            comspec:process.env.ComSpec,comspecExists:fs.existsSync(process.env.ComSpec||''),
            npmShim:fs.readFileSync(npm,'utf8').slice(0,1200),
            tscShim:fs.readFileSync('node_modules/.bin/tsc.cmd','utf8').slice(0,1200),
            run:{status:ran.status,error:ran.error?.message,stdout:ran.stdout,stderr:ran.stderr}}));
          '@ | node --input-type=module -
      - name: Portable and Windows contract tests
        run: node --test --test-concurrency=1 test/*.test.mjs
