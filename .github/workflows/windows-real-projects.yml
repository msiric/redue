name: Windows public-project acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        project: [npm, yarn, pnpm]
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install the distributable candidate
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'redue-public-install'
          $pack = npm pack --json | ConvertFrom-Json
          npm.cmd install --global --prefix $prefix $pack[0].filename --no-audit --no-fund
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $packageName = (Get-Content package.json | ConvertFrom-Json).name
          "REDUE_ACCEPTANCE_CLI=$(Join-Path $prefix "node_modules/$packageName/bin/redue.mjs")" >> $env:GITHUB_ENV
      - name: Exercise real public repository on native NTFS
        shell: pwsh
        env:
          REDUE_DECISION_PROFILE: '1'
          REDUE_PUBLIC_INPUT_TRACE: '1'
        run: ./test/acceptance/windows-project.ps1 -Project ${{ matrix.project }}
