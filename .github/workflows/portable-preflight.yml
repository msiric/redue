# Fixed bounded public Mach-O output collection only, never behavior proof.
# No credentials, uploads, C builds, target/native/model executions or trust changes.
name: Fixed public Mach-O inspection
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: redue-sealed-host-tool-inventory
  cancel-in-progress: false
jobs:
  inventory:
    name: Public static inspection (${{ matrix.machine }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        machine: [producer, receiver]
    if: github.repository == 'msiric/redue' && github.ref == 'refs/heads/dev/portable-sealed-host-preflight' && github.event_name == 'workflow_dispatch' && github.actor == 'msiric' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 2
    env:
      REVIEWED_SOURCE: e3095472a1b701c0d6475e7e39d93b91833ef0ce
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.REVIEWED_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
      - name: Fixed source and classifier precondition, no installation scripts
        id: source_classifier
        shell: bash
        run: |
          set -euo pipefail
          for redue_env_key in NODE_OPTIONS NODE_PATH BASH_ENV ENV DYLD_INSERT_LIBRARIES DYLD_LIBRARY_PATH DYLD_FRAMEWORK_PATH DYLD_FALLBACK_LIBRARY_PATH DYLD_FALLBACK_FRAMEWORK_PATH DYLD_ROOT_PATH LD_PRELOAD LD_LIBRARY_PATH ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN CLAUDE_CODE_OAUTH_TOKEN OPENAI_API_KEY GH_TOKEN GITHUB_TOKEN NPM_TOKEN NODE_AUTH_TOKEN; do
            if [ "${!redue_env_key+x}" = x ]; then
              printf '%s\n' 'PREAUTH_ENVIRONMENT_UNSUPPORTED' >&2
              exit 74
            fi
          done
          test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE"
          test "$(uname -m)" = arm64
          test "$(node --version)" = v22.13.0
          node --test test/sealed-typescript-public-macho-inspection.test.mjs
      - name: Fixed public tool version, help and ARM64e inspection data only
        shell: bash
        run: |
          set -euo pipefail
          for redue_env_key in NODE_OPTIONS NODE_PATH BASH_ENV ENV DYLD_INSERT_LIBRARIES DYLD_LIBRARY_PATH DYLD_FRAMEWORK_PATH DYLD_FALLBACK_LIBRARY_PATH DYLD_FALLBACK_FRAMEWORK_PATH DYLD_ROOT_PATH LD_PRELOAD LD_LIBRARY_PATH ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN CLAUDE_CODE_OAUTH_TOKEN OPENAI_API_KEY GH_TOKEN GITHUB_TOKEN NPM_TOKEN NODE_AUTH_TOKEN; do
            if [ "${!redue_env_key+x}" = x ]; then
              printf '%s\n' 'PREAUTH_ENVIRONMENT_UNSUPPORTED' >&2
              exit 74
            fi
          done
          test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE"
          test "$(uname -m)" = arm64
          test "$(node --version)" = v22.13.0
          node --input-type=module <<'NODE'
          import {inspectFixedNativeStartupPublicBinaries} from './test/acceptance/sealed-typescript-public-macho-inspection.mjs';
          let inspection=null;
          try{inspection=inspectFixedNativeStartupPublicBinaries();}catch{/* UNKNOWN; never raw errors. */}
          const r=inspection;
          const collected=r?.schema===1&&r.interpretation==='redue-fixed-public-macho-inspection@1'&&r.scope==='PUBLIC_STATIC_SOURCE_INSPECTION_ONLY'&&r.outcome==='PUBLIC_OUTPUT_COLLECTED_NOT_BEHAVIOR_PROOF'&&
            r.publicOutputUntrusted===true&&r.ownedDescriptorsClosed===true&&r.ownedCwdCleanup==='REMOVED_OWNED_EMPTY_CWD'&&Array.isArray(r.calls)&&r.calls.length===4&&
            ['version','help','bash','path_helper'].every((role,i)=>{const c=r.calls[i];return c?.role===role&&c.complete===true&&c.pidObserved===true&&c.exitCode===0&&c.signal===null&&c.errorCode===null&&c.stderrEmpty===true;})&&
            r.targets?.bash?.outputObserved===true&&r.targets?.path_helper?.outputObserved===true&&r.profileApproved===false&&r.sealed===false&&r.reuseEligible===false&&
            r.models===0&&r.nativeAgentLaunches===0&&r.targetExecutions===0&&r.compilerCheckExecutions===0&&r.behavior==='NOT_ESTABLISHED'&&r.appleAuthenticity==='NOT_ESTABLISHED'&&r.nativeEnforcement==='NOT_ESTABLISHED'&&r.completeSdkClosure==='NOT_ESTABLISHED';
          // Full bounded public stdout is untrusted data for independent source
          // review. A successful job means collection only, not native acceptance.
          console.log(JSON.stringify({schema:1,scope:'FIXED_CI_PUBLIC_MACHO_INSPECTION_DATA_ONLY',outcome:collected?'PUBLIC_OUTPUT_COLLECTED_NOT_BEHAVIOR_PROOF':'UNKNOWN',inspection}));
          process.exitCode=collected?0:74;
          NODE
      # Any missing guard remains UNKNOWN/exit74; no retries or continue-on-error.
      # Public output cap:17MiB+72KiB before JSON escaping; no artifact upload.
      # No model credentials/environment, cache, OIDC, signing or authority transfer.
