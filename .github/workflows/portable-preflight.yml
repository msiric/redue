# Fixed public bytes only. No build, native/model, artifact, signing or trust route.
name: Fixed CI enclosure header observations
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: redue-sealed-host-tool-inventory
  cancel-in-progress: false
jobs:
  inventory:
    name: Fixed public headers (${{ matrix.machine }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        machine: [producer, receiver]
    if: github.repository == 'msiric/redue' && github.ref == 'refs/heads/dev/portable-sealed-host-preflight' && github.event_name == 'workflow_dispatch' && github.actor == 'msiric' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 2
    env:
      REVIEWED_SOURCE: 3edffa5631342a087bf5999cef031a3dcd102381
    steps:
      - name: Refuse a missing reviewed runtime binding before checkout
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$REVIEWED_SOURCE" =~ ^[a-f0-9]{40}$ ]]; then
            printf '%s\n' 'REVIEWED_RUNTIME_UNAVAILABLE' >&2
            exit 74
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.REVIEWED_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
      - name: Fixed source and mock prerequisites, no installation scripts
        id: source_classifier
        shell: bash
        run: |
          set -euo pipefail
          for redue_env_key in NODE_OPTIONS NODE_PATH PS1 MANPATH BASH_ENV ENV TERM_PROGRAM DYLD_INSERT_LIBRARIES DYLD_LIBRARY_PATH DYLD_FRAMEWORK_PATH DYLD_FALLBACK_LIBRARY_PATH DYLD_FALLBACK_FRAMEWORK_PATH DYLD_ROOT_PATH LD_PRELOAD LD_LIBRARY_PATH ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN CLAUDE_CODE_OAUTH_TOKEN OPENAI_API_KEY GH_TOKEN GITHUB_TOKEN NPM_TOKEN NODE_AUTH_TOKEN; do
            if [ "${!redue_env_key+x}" = x ]; then
              printf '%s\n' 'PREAUTH_ENVIRONMENT_UNSUPPORTED' >&2
              exit 74
            fi
          done
          test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE"
          test "$(uname -m)" = arm64
          test "$(node --version)" = v22.13.0
          node --test test/sealed-typescript-ci-enclosure-headers.test.mjs test/sealed-typescript-host-tool-inventory.test.mjs
      - name: Fixed public machine and header observation, no native agent
        if: ${{ !cancelled() && steps.source_classifier.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          for redue_env_key in NODE_OPTIONS NODE_PATH PS1 MANPATH BASH_ENV ENV TERM_PROGRAM DYLD_INSERT_LIBRARIES DYLD_LIBRARY_PATH DYLD_FRAMEWORK_PATH DYLD_FALLBACK_LIBRARY_PATH DYLD_FALLBACK_FRAMEWORK_PATH DYLD_ROOT_PATH LD_PRELOAD LD_LIBRARY_PATH ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN CLAUDE_CODE_OAUTH_TOKEN OPENAI_API_KEY GH_TOKEN GITHUB_TOKEN NPM_TOKEN NODE_AUTH_TOKEN; do
            if [ "${!redue_env_key+x}" = x ]; then
              printf '%s\n' 'PREAUTH_ENVIRONMENT_UNSUPPORTED' >&2
              exit 74
            fi
          done
          test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE"
          test "$(uname -m)" = arm64
          test "$(node --version)" = v22.13.0
          # Named nonsecret runner facts only; missing facts never imply a match.
          redue_image_os="${ImageOS-UNAVAILABLE}"
          redue_image_version="${ImageVersion-UNAVAILABLE}"
          redue_fs=$(/usr/bin/stat -f '%T' "$GITHUB_WORKSPACE")
          redue_os=$(/usr/bin/sw_vers -productVersion)
          redue_kernel=$(/usr/bin/uname -r)
          for redue_fact in "$redue_image_os" "$redue_image_version" "$redue_fs" "$redue_os" "$redue_kernel"; do
            if ! [[ "$redue_fact" =~ ^[A-Za-z0-9._-]{1,80}$ ]]; then
              printf '%s\n' 'PUBLIC_RUNNER_FACT_UNAVAILABLE' >&2
              exit 74
            fi
          done
          printf '{"scope":"PUBLIC_RUNNER_FACTS_ONLY","source":"%s","machine":"%s","os":"%s","kernel":"%s","arch":"arm64","filesystem":"%s","imageOS":"%s","imageVersion":"%s","profileMatch":"NOT_EVALUATED"}\n' "$REVIEWED_SOURCE" '${{ matrix.machine }}' "$redue_os" "$redue_kernel" "$redue_fs" "$redue_image_os" "$redue_image_version"
          node test/acceptance/sealed-typescript-host-tool-inventory.mjs --fixed-ci-enclosure-headers
      # The helper's 10s checkpoint budget cannot interrupt blocked filesystem IO.
      # The 2-minute job limit remains independent; no output becomes trusted input.
