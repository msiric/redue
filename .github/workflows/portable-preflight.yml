# Fixed bounded public Mach-O output collection only, never behavior proof.
# Public-data artifacts only; no credentials, C builds, target/native/model executions or trust changes.
name: Fixed public Mach-O inspection
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: redue-sealed-host-tool-inventory
  cancel-in-progress: false
jobs:
  inventory:
    name: Public static inspection (${{ matrix.machine }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        machine: [producer, receiver]
    if: github.repository == 'msiric/redue' && github.ref == 'refs/heads/dev/portable-sealed-host-preflight' && github.event_name == 'workflow_dispatch' && github.actor == 'msiric' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 2
    env:
      REVIEWED_SOURCE: 08b127154bdc7634ea76763675c0a1df5ed61d77
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.REVIEWED_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
      - name: Fixed source and classifier precondition, no installation scripts
        id: source_classifier
        shell: bash
        run: |
          set -euo pipefail
          for redue_env_key in NODE_OPTIONS NODE_PATH BASH_ENV ENV DYLD_INSERT_LIBRARIES DYLD_LIBRARY_PATH DYLD_FRAMEWORK_PATH DYLD_FALLBACK_LIBRARY_PATH DYLD_FALLBACK_FRAMEWORK_PATH DYLD_ROOT_PATH LD_PRELOAD LD_LIBRARY_PATH ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN CLAUDE_CODE_OAUTH_TOKEN OPENAI_API_KEY GH_TOKEN GITHUB_TOKEN NPM_TOKEN NODE_AUTH_TOKEN; do
            if [ "${!redue_env_key+x}" = x ]; then
              printf '%s\n' 'PREAUTH_ENVIRONMENT_UNSUPPORTED' >&2
              exit 74
            fi
          done
          test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE"
          test "$(uname -m)" = arm64
          test "$(node --version)" = v22.13.0
          node --test test/sealed-typescript-public-macho-inspection.test.mjs test/sealed-typescript-public-inspection-files.test.mjs
      - name: Collect fixed public files; UNKNOWN data is not inspection success
        id: collect_public_data
        shell: bash
        run: |
          set -euo pipefail
          for redue_env_key in NODE_OPTIONS NODE_PATH BASH_ENV ENV DYLD_INSERT_LIBRARIES DYLD_LIBRARY_PATH DYLD_FRAMEWORK_PATH DYLD_FALLBACK_LIBRARY_PATH DYLD_FALLBACK_FRAMEWORK_PATH DYLD_ROOT_PATH LD_PRELOAD LD_LIBRARY_PATH ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN CLAUDE_CODE_OAUTH_TOKEN OPENAI_API_KEY GH_TOKEN GITHUB_TOKEN NPM_TOKEN NODE_AUTH_TOKEN; do
            if [ "${!redue_env_key+x}" = x ]; then
              printf '%s\n' 'PREAUTH_ENVIRONMENT_UNSUPPORTED' >&2
              exit 74
            fi
          done
          test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE"
          test "$(uname -m)" = arm64
          test "$(node --version)" = v22.13.0
          node --input-type=module <<'NODE'
          import {collectFixedPublicMachOInspectionFiles} from './test/acceptance/sealed-typescript-public-inspection-files.mjs';
          let r=null;try{r=collectFixedPublicMachOInspectionFiles();}catch{/* UNKNOWN, no raw error. */}
          const ready=r?.schema===1&&r.scope==='FIXED_PUBLIC_INSPECTION_FILE_TRANSPORT_ONLY'&&r.transport==='PUBLIC_REPORT_FILES_READY'&&r.ownedDescriptorsClosed===true&&r.directory==='.redue-public-inspection'&&
           JSON.stringify(r.files)==='["public-inspection.json.gz","manifest.json"]'&&r.untrustedPublicData===true&&r.profileApproved===false&&r.sealed===false&&r.reuseEligible===false&&r.models===0&&r.nativeAgentLaunches===0&&r.targetExecutions===0&&r.compilerCheckExecutions===0;
          const count=v=>Number.isSafeInteger(v)&&v>=0&&v<=24*1024*1024?v:null,digest=v=>typeof v==='string'&&/^[a-f0-9]{64}$/.test(v)?v:null;
          console.log(JSON.stringify({schema:1,scope:'PUBLIC_FILE_TRANSPORT_STATUS_ONLY',outcome:ready?'PUBLIC_DATA_FILES_READY':'UNKNOWN',inspectionOutcome:['UNKNOWN','PUBLIC_OUTPUT_COLLECTED_NOT_BEHAVIOR_PROOF'].includes(r?.inspectionOutcome)?r.inspectionOutcome:'UNKNOWN',rawBytes:count(r?.rawBytes),compressedBytes:count(r?.compressedBytes),payloadBytes:count(r?.payloadBytes),rawSha256:digest(r?.rawSha256),compressedSha256:digest(r?.compressedSha256),manifestSha256:digest(r?.manifestSha256)}));
          process.exitCode=ready?0:74; // File readiness is not inspection success.
          NODE
