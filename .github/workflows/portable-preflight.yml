# Fixed build-only preparation. No built helper/native/model, upload, signing or trust route.
name: Fixed CI eight-build preparation only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: redue-sealed-host-tool-inventory
  cancel-in-progress: false
jobs:
  inventory:
    name: Fixed eight-build preparation (${{ matrix.machine }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        machine: [producer, receiver]
    if: github.repository == 'msiric/redue' && github.ref == 'refs/heads/dev/portable-sealed-host-preflight' && github.event_name == 'workflow_dispatch' && github.actor == 'msiric' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 2
    env:
      REVIEWED_SOURCE: 1f3f93d370a3c8849fa386634907a1e4aedb6673
    steps:
      - name: Refuse a missing reviewed runtime binding before checkout
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$REVIEWED_SOURCE" =~ ^[a-f0-9]{40}$ ]]; then
            printf '%s\n' 'REVIEWED_RUNTIME_UNAVAILABLE' >&2
            exit 74
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.REVIEWED_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
      - name: Fixed source and mock prerequisites, no installation scripts
        id: source_classifier
        shell: bash
        run: |
          set -euo pipefail
          for redue_env_key in NODE_OPTIONS NODE_PATH PS1 MANPATH BASH_ENV ENV TERM_PROGRAM DYLD_INSERT_LIBRARIES DYLD_LIBRARY_PATH DYLD_FRAMEWORK_PATH DYLD_FALLBACK_LIBRARY_PATH DYLD_FALLBACK_FRAMEWORK_PATH DYLD_ROOT_PATH LD_PRELOAD LD_LIBRARY_PATH ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN CLAUDE_CODE_OAUTH_TOKEN OPENAI_API_KEY GH_TOKEN GITHUB_TOKEN NPM_TOKEN NODE_AUTH_TOKEN; do
            if [ "${!redue_env_key+x}" = x ]; then
              printf '%s\n' 'PREAUTH_ENVIRONMENT_UNSUPPORTED' >&2
              exit 74
            fi
          done
          # Key names only. Presence (including empty values) is unsupported.
          # Do not clear overrides or print their values and continue.
          while IFS= read -r redue_env_key; do
            redue_upper_env_key=$(printf '%s' "$redue_env_key" | /usr/bin/tr '[:lower:]' '[:upper:]')
            case "$redue_upper_env_key" in
              NODE_OPTIONS|NODE_PATH|NODE_REPL_EXTERNAL_MODULE|BASH_ENV|ENV|DYLD_*|LD_*|OPENSSL_*|SIMPLE|REDUE_DECISION_PROFILE|REDUE_DECISION_PROFILE_FILE|REDUE_PROFILE_CONTEXT)
                printf '%s\n' 'PREAUTH_ENVIRONMENT_UNSUPPORTED' >&2
                exit 74
                ;;
            esac
          done < <(compgen -e)
          test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE"
          test "$(uname -m)" = arm64
          test "$(node --version)" = v22.13.0
          node --test test/sealed-typescript-ci-enclosure-headers.test.mjs test/sealed-typescript-host-tool-inventory.test.mjs test/sealed-typescript-ci-native-assets.test.mjs test/sealed-typescript-ci-enclosure-consumers.test.mjs test/sealed-typescript-ci-enclosure-preparation.test.mjs test/sealed-typescript-ci-enclosure-parent.test.mjs test/sealed-typescript-preparation-cost.test.mjs
      - name: Fixed public facts and eight-build preparation, no helper execution
        if: ${{ !cancelled() && steps.source_classifier.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          for redue_env_key in NODE_OPTIONS NODE_PATH PS1 MANPATH BASH_ENV ENV TERM_PROGRAM DYLD_INSERT_LIBRARIES DYLD_LIBRARY_PATH DYLD_FRAMEWORK_PATH DYLD_FALLBACK_LIBRARY_PATH DYLD_FALLBACK_FRAMEWORK_PATH DYLD_ROOT_PATH LD_PRELOAD LD_LIBRARY_PATH ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN CLAUDE_CODE_OAUTH_TOKEN OPENAI_API_KEY GH_TOKEN GITHUB_TOKEN NPM_TOKEN NODE_AUTH_TOKEN; do
            if [ "${!redue_env_key+x}" = x ]; then
              printf '%s\n' 'PREAUTH_ENVIRONMENT_UNSUPPORTED' >&2
              exit 74
            fi
          done
          # Key names only. Presence (including empty values) is unsupported.
          # Do not clear overrides or print their values and continue.
          while IFS= read -r redue_env_key; do
            redue_upper_env_key=$(printf '%s' "$redue_env_key" | /usr/bin/tr '[:lower:]' '[:upper:]')
            case "$redue_upper_env_key" in
              NODE_OPTIONS|NODE_PATH|NODE_REPL_EXTERNAL_MODULE|BASH_ENV|ENV|DYLD_*|LD_*|OPENSSL_*|SIMPLE|REDUE_DECISION_PROFILE|REDUE_DECISION_PROFILE_FILE|REDUE_PROFILE_CONTEXT)
                printf '%s\n' 'PREAUTH_ENVIRONMENT_UNSUPPORTED' >&2
                exit 74
                ;;
            esac
          done < <(compgen -e)
          test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE"
          test "$(uname -m)" = arm64
          test "$(node --version)" = v22.13.0
          # Named nonsecret runner facts only; missing facts never imply a match.
          redue_image_os="${ImageOS-UNAVAILABLE}"
          redue_image_version="${ImageVersion-UNAVAILABLE}"
          redue_fs=$(node -e 'const fs=require("node:fs");const t=fs.statfsSync(process.cwd(),{bigint:true}).type;if(typeof t!=="bigint"||t<0n||t>4294967295n)process.exit(74);process.stdout.write(t.toString());')
          if ! [[ "$redue_fs" =~ ^[0-9]{1,10}$ ]]; then
            printf '%s\n' 'PUBLIC_FILESYSTEM_TYPE_UNAVAILABLE' >&2
            exit 74
          fi
          redue_os=$(/usr/bin/sw_vers -productVersion)
          redue_kernel=$(/usr/bin/uname -r)
          for redue_fact in "$redue_image_os" "$redue_image_version" "$redue_fs" "$redue_os" "$redue_kernel"; do
            if ! [[ "$redue_fact" =~ ^[A-Za-z0-9._-]{1,80}$ ]]; then
              printf '%s\n' 'PUBLIC_RUNNER_FACT_UNAVAILABLE' >&2
              exit 74
            fi
          done
          printf '{"scope":"PUBLIC_RUNNER_FACTS_ONLY","source":"%s","machine":"%s","os":"%s","kernel":"%s","arch":"arm64","filesystem_type":%s,"imageOS":"%s","imageVersion":"%s","profileMatch":"NOT_EVALUATED"}\n' "$REVIEWED_SOURCE" '${{ matrix.machine }}' "$redue_os" "$redue_kernel" "$redue_fs" "$redue_image_os" "$redue_image_version"
          # Read-only paired identities are diagnostics, never profile admission.
          # Retain both results even when this observation is UNKNOWN; the parent
          # independently enforces every existing fixed build prerequisite.
          redue_observation_status=0
          node test/acceptance/sealed-typescript-host-tool-inventory.mjs --fixed-ci-paired-profile || redue_observation_status=$?
          redue_preparation_status=0
          /usr/bin/python3 -I -S test/acceptance/sealed-typescript-enclosure-provisioning-parent.py --ci-run || redue_preparation_status=$?
          printf '{"scope":"FIXED_PUBLIC_OBSERVATION_AND_PREPARATION_EXIT_ONLY","observation_exit":%s,"preparation_exit":%s,"profile_admission":false,"reuse_eligible":false}\n' "$redue_observation_status" "$redue_preparation_status"
          if [ "$redue_observation_status" -ne 0 ] || [ "$redue_preparation_status" -ne 0 ]; then
            exit 74
          fi
      # Parent: original 60s body + <=5s cleanup / 65s total. Filesystem
      # checkpoints are not OS-interruptible; the 2-minute job cap stays independent.
      # Reports grant no sealing, native, origin, receipt or reusable-evidence authority.
