# Task-branch-only fixed recipient phase sample on frozen candidate bytes.
name: Portable evidence recipient candidate phase diagnosis (no models)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: portable-recipient-profile
  cancel-in-progress: false
jobs:
  profile:
    if: github.repository == 'msiric/redue' && github.ref == 'refs/heads/dev/portable-recipient-decision' && github.event_name == 'workflow_dispatch' && github.actor == 'msiric' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
      - run: npm ci --no-audit --no-fund
      - name: Pack this reviewed task source once, without publication or signing
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -m 700 frozen-candidate
          npm pack --json --pack-destination frozen-candidate > frozen-candidate/manifest.json
          node test/acceptance/package-artifact.mjs record frozen-candidate/manifest.json
          printf '%s\n' "$GITHUB_SHA" > frozen-candidate/source.txt
      - name: Verify candidate identity and storage reservation before installation
        run: |
          node test/acceptance/package-artifact.mjs verify frozen-candidate/manifest.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {readArtifact} from './test/acceptance/package-artifact.mjs';
          const a=readArtifact('frozen-candidate/manifest.json');
          assert.equal(a.metadata.version,'0.1.0-alpha.11');
          assert.equal(fs.readFileSync('frozen-candidate/source.txt','utf8').trim(),process.env.GITHUB_SHA);
          assert.deepEqual(fs.readdirSync('frozen-candidate').sort(),['manifest.json','SHA256SUMS','source.txt',a.metadata.filename].sort());
          assert(fs.readdirSync('frozen-candidate').reduce((sum,file)=>sum+fs.statSync('frozen-candidate/'+file).size,0)<=250*1024);
          fs.appendFileSync(process.env.GITHUB_ENV,'PROFILE_SHA256='+a.sha256+'\n');
          JS
      - name: Affected runtime and selection regressions
        run: node --test --test-concurrency=1 test/portable-runtime-certificate.test.mjs test/portable-runtime-cache.test.mjs test/portable-facts.test.mjs test/receipt-selection.test.mjs
      - name: Six unchanged queries across three owned observer sessions
        run: node test/acceptance/portable-recipient-profile.mjs --manifest frozen-candidate/manifest.json --source "$GITHUB_SHA" --sha256 "$PROFILE_SHA256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-recipient-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: frozen-candidate/*
          retention-days: 1
          overwrite: false
          if-no-files-found: error
      # One bounded owned artifact within the confirmed included allowance;
      # no cache, model credentials, inference, signing, or producer-trust changes.
