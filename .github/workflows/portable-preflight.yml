# One bounded CI-only raw-event provider attempt. No models, tokens, signing,
# uploads, imported authority, or changes to native-agent permissions.
name: Portable ordinary-query raw observation preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-ordinary-query-preflight
  cancel-in-progress: false
jobs:
  provider:
    if: github.repository == 'msiric/redue' && github.ref == 'refs/heads/dev/portable-ordinary-boundary' && github.event_name == 'workflow_dispatch' && github.actor == 'msiric' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
      - run: npm ci --no-audit --no-fund
      - name: Source and pure protocol/ownership controls; never start the collector locally
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test --test-concurrency=1 test/portable-ancestor-queries.test.mjs test/portable-ancestor-fsevents.test.mjs test/portable-ancestor-protocol.test.mjs test/portable-ancestor-capability.test.mjs test/portable-ancestor-observer.test.mjs
      - name: One fixed real provider trial on this owned standard runner only
        run: node test/acceptance/portable-ancestor-stream.mjs
