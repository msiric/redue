# Reviewed child-witness workflow; protected fresh owner facts still required.
# Fresh independent workflow review, exact protected source/account/capacity facts
# and the existing effective native security prerequisites must pass first.
# Observes child bindings/stdio only; no global startup, pre-main, seal or reuse proof.
name: Bounded native Claude child startup witness
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: redue-native-claude-boundary-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.repository == 'msiric/redue' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev/portable-claude-diagnostic' && github.actor == 'msiric' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 2
    environment: portable-evidence-claude
    env:
      REVIEWED_SOURCE: bc50a9f1111625151a3c805f050a718bfe8252d6
      REDUE_CLAUDE_ACCOUNT_POLICY_FACT: ${{ vars.REDUE_CLAUDE_ACCOUNT_POLICY_FACT }}
      REDUE_CLAUDE_INCLUDED_DIAGNOSTIC_CAPACITY: ${{ vars.REDUE_CLAUDE_INCLUDED_DIAGNOSTIC_CAPACITY }}
    steps:
      - name: Start total job clock and reject unresolved source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_RUN_ATTEMPT" = 1
          printf 'REDUE_DIAGNOSTIC_JOB_STARTED_MS=%s\n' "$(($(date +%s)*1000))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.REVIEWED_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
      - name: Validate owner prerequisites and prepare exact public native fixture without credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE"
          test "$(uname -m)" = 'arm64'
          while IFS= read -r key; do
            case "$key" in NODE_OPTIONS|NODE_PATH|BASH_ENV|ENV|LD_*|DYLD_*|OPENSSL_*|CLAUDE_*|ANTHROPIC_*) exit 2;; esac
          done < <(compgen -e)
          test "$(node --version)" = 'v22.13.0'
          export REDUE_CHECKED_SOURCE="$REVIEWED_SOURCE"
          node test/acceptance/portable-claude-diagnostic.mjs --check-prerequisites --source "$REVIEWED_SOURCE"
          node --test test/sealed-typescript-native-startup-witness.test.mjs test/sealed-typescript-native-stdio-startup.test.mjs test/sealed-typescript-native-stdio-diagnostic.test.mjs
          base="$(mktemp -d /private/tmp/redue-claude-diagnostic-XXXXXX)"
          chmod 700 "$base"
          mkdir -m 700 "$base/native"
          curl --fail --location --silent --show-error --max-time 35 \
            https://downloads.claude.ai/claude-code-releases/2.1.187/darwin-arm64/claude \
            --output "$base/native/claude"
          test "$(shasum -a 256 "$base/native/claude" | cut -d ' ' -f1)" = a59a16ba4922adab7a145728f215d042184d349f5f7e72cddb7fc114250a4ce3
          chmod 700 "$base/native/claude"
          export REDUE_DIAGNOSTIC_BASE="$base"
          printf 'REDUE_DIAGNOSTIC_BASE=%s\n' "$base" >> "$GITHUB_ENV"
      - name: One bounded subscription-authenticated native child witness
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          # No owner token is printed, copied to a file, or released to another step.
          while IFS= read -r key; do
            case "$key" in
              CLAUDE_CODE_OAUTH_TOKEN) ;;
              NODE_OPTIONS|NODE_PATH|BASH_ENV|ENV|LD_*|DYLD_*|OPENSSL_*|CLAUDE_*|ANTHROPIC_*) exit 2;;
            esac
          done < <(compgen -e)
          export REDUE_CHECKED_SOURCE="$REVIEWED_SOURCE"
          test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE"
          test "$(uname -m)" = 'arm64'
          test "$(node --version)" = 'v22.13.0'
          node --input-type=module <<'NODE'
          import {runFixedNativeStartupWitnessDiagnostic} from './test/acceptance/sealed-typescript-native-stdio-diagnostic.mjs';
          const scope='FIXED_SINGLE_DIRECT_NATIVE_CHILD_STARTUP_WITNESS_DIAGNOSTIC_ONLY';
          const intendedSource='bc50a9f1111625151a3c805f050a718bfe8252d6',nativeVersion='2.1.187',nativeSha256='a59a16ba4922adab7a145728f215d042184d349f5f7e72cddb7fc114250a4ce3',witnessInterpretation='native187-direct-bash-child-startup-witness@1';
          const abort=new AbortController(),cancel=()=>abort.abort();
          for(const sig of ['SIGINT','SIGTERM','SIGHUP'])process.on(sig,cancel);
          try{
           const report=await runFixedNativeStartupWitnessDiagnostic({env:process.env,source:process.env.REDUE_CHECKED_SOURCE,signal:abort.signal});
           if(report?.schema!==1||report.scope!==scope||report.source!==intendedSource||report.nativeVersion!==nativeVersion||report.nativeSha256!==nativeSha256||report.witnessInterpretation!==witnessInterpretation||report.nativeEnforcement!=='NOT_ESTABLISHED'||report.controlledShellEnforcement!=='NOT_ESTABLISHED'||report.preMainLoader!=='NOT_ESTABLISHED'||report.completeSdkClosure!=='NOT_ESTABLISHED'||report.sealed!==false||report.reuseEligible!==false||report.portableApplicability!=='NOT_TESTED'||report.agentReuse!=='NOT_TESTED'||report.rawTranscriptRetained!==false||report.rawStderrRetained!==false)throw Error('FIXED_WITNESS_SCOPE_UNAVAILABLE');
           // Pinned controller produces redacted structured observations only;
           // no native/model stdout, credential value or imported report is logged.
           console.log(JSON.stringify(report));process.exitCode=report.outcome==='OBSERVED_COMPATIBLE'?0:2;
          }catch{
           // These fixed fallback labels describe intended configuration, not a
           // measured binary, executed helper or observed native result.
           console.log(JSON.stringify({schema:1,scope,source:intendedSource,nativeVersion,nativeSha256,witnessInterpretation,identityBasis:'CONFIGURED_EXPECTATIONS_NOT_OBSERVATIONS',completeSdkClosure:'NOT_ESTABLISHED',outcome:'UNKNOWN',reason:'FIXED_WITNESS_ENTRY_UNAVAILABLE',nativeEnforcement:'NOT_ESTABLISHED',controlledShellEnforcement:'NOT_ESTABLISHED',preMainLoader:'NOT_ESTABLISHED',sealed:false,reuseEligible:false,portableApplicability:'NOT_TESTED',agentReuse:'NOT_TESTED',rawTranscriptRetained:false,rawStderrRetained:false}));process.exitCode=2;
          }finally{for(const sig of ['SIGINT','SIGTERM','SIGHUP'])process.removeListener(sig,cancel);}
          NODE
      # No uploads, cache, OIDC, signing, agent SDK, terminal input or automatic retry.
      # The whole job includes checkout/download/prepare/drain inside two minutes.
      # Protected owner fact source must equal the runtime above with a truthful
      # fresh reviewed_at; existing capacity and OAuth secret names stay unchanged.
      # A missing precondition or deadline is UNKNOWN, never a waiver or API fallback.
      # OBSERVED_COMPATIBLE is scoped to child bindings/stdio, not G2 or a seal.
